# The pinned build toolchain.
#
# WHY THIS FILE EXISTS. This program's whole purpose is byte-exact replay of
# solutions people spent years recording. The compiler is an input to that, and
# until this file existed CI ran `pacman -S mingw-w64-x86_64-gcc` and built with
# whatever version happened to be current that morning -- with nothing recording
# which one, and nothing saying when it changed.
#
# HOW IT IS ENFORCED. The CI jobs install this exact package by URL rather than
# by name, then assert that `gcc -dumpversion` matches. A mismatch fails the job
# rather than building quietly with something else.
#
# ⚠ TWO FILES, NOT ONE. gcc depends on exactly its own release of gcc-libs, so
# both are fetched by URL in a single pacman transaction. Installing gcc alone
# left that dependency to the refreshed database, and on 2026-09-21 the mirror's
# database moved to 16.2.0-4 while still keeping the 16.2.0-3 FILES -- CI went
# red ("cannot resolve mingw-w64-x86_64-gcc-libs=16.2.0-3") on a commit that
# touched two documents. The pin had not expired; it was one URL short.
#
# ⚠ MSYS2 HAS NO NATIVE VERSION PINNING. There is no `pacman -S gcc=16.2.0`, and
# no lockfile format of its own. Pinning here means fetching the exact package
# file from the repository, which works because repo.msys2.org keeps older
# builds. That is a real dependency on an external mirror: if the file is ever
# removed, the install step fails loudly. That is deliberate. The alternative --
# falling back to the current package - would silently undo the pin, which is
# the exact thing this file is here to prevent.
#
# 🔴 UPDATING THIS IS A DELIBERATE ACT, NOT A CHORE. A new compiler can change
# code generation, and this fork has thirty-two behavior toggles and a solution
# corpus riding on it. Before bumping a version here:
#
#   1. run test\run-golden.ps1  -- 1,806 engine digests over 903 levels
#   2. run test\run-nofix.ps1   -- every NO_FIX_* witness in the matrix
#   3. run test\run-corpus.ps1  -- the real solution collection, if the change
#                                  is anything more than a patch release
#
# and say in the commit message what you ran. A green CI on its own is not the
# evidence; the golden master is.
#
# HOW TO FIND A VERSION STRING: the package files are listed at
# https://repo.msys2.org/mingw/<msys_env>/ (ucrt64 today) -- take the part
# between "mingw-w64-ucrt-x86_64-gcc-" and "-any.pkg.tar.zst". gcc and gcc-libs
# must both exist at that version (see "TWO FILES" above).

# The MSYS2 ENVIRONMENT everything builds in. The package prefix, the repository
# folder and the C:\msys64\<env> tree every script uses all follow from this one
# line: msys-env.ps1 reads it for the scripts, .github\install-toolchain.ps1 for
# CI. UCRT64 since 2026-11-21 (jc-62): MSYS2 is retiring MINGW64, and removed its
# static Qt 5 that day. 🔴 CHANGING IT IS A COMPILER CHANGE: a different C
# runtime under the same gcc version. It was made with the full checklist above,
# the solution corpus included, and so must the next one be.
msys_env=ucrt64

# The MSYS2 package release, exactly as it appears in the file name.
gcc_pkgver=16.2.0-3

# What `gcc -dumpversion` must then report. Checked separately from the package
# version because they are not the same string: the "-3" is an MSYS2 packaging
# revision that the compiler itself never mentions.
gcc_version=16.2.0

# --------------------------------------------------------------------------
# NOTE: THE DESKTOP IS ON THIS PIN since 2026-11-21: the UCRT64 toolchain went on
# it through .github\install-toolchain.ps1, the script CI runs, so it builds with
# exactly CI's compiler. THE LAPTOP IS ON IT TOO since 2026-11-22. It had no
# MSYS2 at all (not "only MINGW64", as this note first said), so it got MSYS2 at
# C:\msys64 first, then the same script, plus the static Qt file release.yml pins.
# A NEW PC does the same: MSYS2, then
#   .github\install-toolchain.ps1 -Extra cmake,ninja,SDL2,pkgconf,qt5-base
# and then the static Qt file release.yml pins (URL + SHA-256, pacman -U), which
# build.ps1's default static flavor needs. Without it only -Flavor dynamic builds.
# qt5-base is for the dynamic flavor and the Qt test layer. Both Qts side by side
# is how both PCs build; the laptop's static build, made that way, replays the
# corpus identically to CI's jc-62 asset. release.yml keeps qt5-base out of the
# job that builds the release, its own choice (see the comment there).
#
# History, kept because the evidence still holds: until then the desktop built
# with MINGW64's gcc 16.1.0 while CI pinned 16.2.0, and that divergence was not a
# problem, with direct evidence
# rather than an assumption: test/golden/engine-snapshot.tsv was generated on
# the 16.1.0 desktop, and the `golden` CI job recomputes all 1,806 digests on
# Linux with a different compiler entirely and gets the same answers. Two
# toolchains, identical engine behavior, checked on every push.
#
# If that job ever goes red after a toolchain bump, THAT is the signal this
# whole arrangement exists to produce. Do not re-baseline it away.
