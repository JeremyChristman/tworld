# The corpus differential — the gate that actually decides a release.
#
# WHY THIS WORKFLOW EXISTS. A blind adversarial audit disabled a shipped engine
# fix (mslogic.c:1832, FIX_CHIP_PICKUP_ON_BLOCK) and every one of the six local
# layers stayed green, golden's 1,806 digests over 903 levels included. Only
# test\run-corpus.ps1 noticed, and it was invoked nowhere in CI — ci.yml:276
# mentioned it in a COMMENT and that was all. Fourteen of the thirty-two
# NO_FIX_* toggles were in that state; six now have named unit cases, and this
# job is what covers the rest.
#
# 🔴 WHY IT IS DISPATCH-ONLY RATHER THAN PART OF CI. The corpus is the
# maintainer's own solution collection: tens of thousands of recorded .tws
# solutions across ~528 sets. docs/adr/0005 forbids committing .tws files at all
# and CI fails on any tracked one, so the collection cannot travel with the
# repository and a GitHub-hosted runner can never have it. That is a licensing
# and privacy decision, not an oversight, and it is why this is opt-in.
#
# ⚠ AND A SKIP HERE IS NOT A PASS. When the corpus is absent this job says so in
# the run summary in as many words and does no work. That is safe ONLY because
# this workflow is never a required check and never runs on push or pull_request
# — nothing else in the repository can mistake its green tick for the gate
# having run. If it is ever wired into a branch protection rule, flip
# `require_corpus` to true first, or it becomes precisely the false green the
# rest of this repository is built to prevent.

name: Corpus differential

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label. Must be a Windows machine that HAS the corpus; windows-latest never does."
        type: string
        default: "self-hosted"
      baseline_ref:
        description: "Git ref to diff against. The question is always 'did any recorded solution stop replaying since X'."
        type: string
        default: "origin/main"
      corpus_path:
        description: "Path to the solution collection. Empty uses run-corpus.ps1's own default."
        type: string
        default: ""
      require_corpus:
        description: "Fail if the corpus is absent instead of skipping. Turn this ON if this job ever becomes a required check."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      # fetch-depth: 0 — the whole point is a differential against another ref,
      # and a shallow clone cannot check one out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 🔴 INPUTS REACH POWERSHELL THROUGH THE ENVIRONMENT, never through a ${{ }}
      # expression in a run: block (release.yml's rule, applied here 2026-11-22 after
      # a review). Actions pastes an expression in as raw text before PowerShell
      # parses the line, so a quote or $( ) in a dispatched value ran as code.
      - name: Is the corpus actually here?
        id: probe
        env:
          CORPUS_PATH: ${{ inputs.corpus_path }}
        run: |
          # The default corpus and what makes a folder one are run-corpus.ps1's
          # rules, in test\corpus-folder.ps1. Dot-sourced, so there is ONE copy
          # and nothing crosses a process boundary: this used to regex a literal
          # out of run-corpus.ps1, and then to capture a child powershell.exe's
          # stdout, which goes through the console code page (review).
          . .\test\corpus-folder.ps1
          $p = $env:CORPUS_PATH
          if (-not $p) { $p = Resolve-DefaultCorpus }
          # A line break would write extra keys into GITHUB_OUTPUT, so a later step
          # could replay a different folder from the one checked here (review).
          if ($p -match "[`r`n]") { throw "the corpus path contains a line break" }
          # A trailing separator is dropped: PowerShell 5.1 passes "D:\CC Corpus\"
          # to the next powershell.exe with its closing quote escaped, which then
          # swallows every later argument (review, measured). A bare root stays.
          if ($p -and $p.Length -gt 3) {
              $p = $p.TrimEnd('\', '/')
              # "D:\\" trims to "D:", which is D:'s CURRENT directory, not its root (review).
              if ($p -match '^[A-Za-z]:$') { $p += '\' }
          }
          Write-Host "corpus path: $p"
          # The very test run-corpus.ps1 applies, so "present" means it will not
          # refuse this folder later, after two full builds (review).
          $problem = Get-CorpusProblem $p
          $present = -not $problem
          if ($problem) { Write-Host "not usable: $problem" }
          "path=$p"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "present=$present" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $present) {
              $msg = @(
                "## The corpus gate DID NOT RUN",
                "",
                "No usable solution collection at ``$p`` ($problem), so nothing was verified here.",
                "",
                "**This tick is not a pass.** It means the check was skipped. The corpus is the",
                "only instrument that can see a recorded solution stop replaying -- the six local",
                "layers cannot, which is the whole reason this workflow exists.",
                "",
                "Run it on a machine that has the collection, or pass ``corpus_path``."
              ) -join "`n"
              $msg | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Write-Host "################################################################"
              Write-Host "  CORPUS ABSENT -- THE GATE DID NOT RUN. This is not a pass."
              Write-Host "################################################################"
          }

      # Deliberately a separate step so the failure is attributable, and so the
      # skip path above stays readable.
      - name: Refuse to skip, if asked
        if: steps.probe.outputs.present != 'True' && inputs.require_corpus
        run: |
          throw "the corpus is absent and require_corpus was set. Nothing was verified."

      - name: Install the toolchain packages
        if: steps.probe.outputs.present == 'True'
        run: powershell -ExecutionPolicy Bypass -File .github/install-toolchain.ps1

      - name: Build this revision
        if: steps.probe.outputs.present == 'True'
        run: |
          powershell -ExecutionPolicy Bypass -File build.ps1
          if ($LASTEXITCODE -ne 0) { throw "the build of HEAD failed" }
          Copy-Item build-static\tworld2.exe head.exe -Force

      # A worktree rather than a second clone: same object store, no refetch, and
      # it cannot disturb the checkout this job is testing.
      # ⚠ A baseline_ref older than jc-62 is built by ITS OWN build.ps1, which uses MINGW64 (and
      # whatever gcc that tree has; install-toolchain.ps1 pins only the msys_env one), while HEAD
      # builds in UCRT64. A verdict difference against such a ref could then be the toolchain, not
      # the change. jc-62's own corpus run found the two toolchains agree on all 334 sets, so this
      # is a caveat, not a known difference -- and it ends once the baseline is jc-62 or later.
      - name: Build the baseline revision
        if: steps.probe.outputs.present == 'True'
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          $ref = $env:BASELINE_REF
          # Through env: it can no longer run as code, but it is still a git
          # ARGUMENT: a leading "-" is an option to git, and PowerShell 5.1 does not
          # escape an embedded quote in a native argument (review). No ref needs either.
          if (-not $ref -or $ref.StartsWith("-") -or $ref -match '[\s"'']') { throw "refusing baseline_ref '$ref'" }
          # --detach, because actions/checkout leaves local branch `main` checked
          # out here: a baseline_ref of plain "main" would otherwise die with
          # "fatal: 'main' is already used by worktree". Verified both ways.
          # Nothing is ever committed in the baseline tree, so detached is right.
          git worktree add --detach ..\tworld-baseline $ref
          if ($LASTEXITCODE -ne 0) { throw "could not check out baseline ref '$ref'" }
          Push-Location ..\tworld-baseline
          try {
              powershell -ExecutionPolicy Bypass -File build.ps1
              if ($LASTEXITCODE -ne 0) { throw "the build of '$ref' failed" }
          } finally { Pop-Location }
          Copy-Item ..\tworld-baseline\build-static\tworld2.exe baseline.exe -Force

      # ⚠ TWO FULL RECORDINGS, AND THE SECOND ONE IS THE COMPARISON. run-corpus
      # exits nonzero when any set's .out differs, which is the desync check;
      # .err differences are advisory and do not fail it. See the script header.
      - name: Record the baseline
        if: steps.probe.outputs.present == 'True'
        env:
          CORPUS_PATH: ${{ steps.probe.outputs.path }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File test\run-corpus.ps1 `
            -Exe baseline.exe -Corpus $env:CORPUS_PATH -Out corpus-baseline
          if ($LASTEXITCODE -ne 0) { throw "the baseline corpus run failed" }

      - name: Did any recorded solution stop replaying?
        if: steps.probe.outputs.present == 'True'
        env:
          CORPUS_PATH: ${{ steps.probe.outputs.path }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File test\run-corpus.ps1 `
            -Exe head.exe -Corpus $env:CORPUS_PATH `
            -Out corpus-head -Against corpus-baseline
          # Not only a changed verdict exits nonzero: so do a failed corpus copy, a
          # run in which no set gave a verdict, and a refused -Corpus. The log says which.
          if ($LASTEXITCODE -ne 0) { throw "the corpus run of HEAD failed, or a recorded solution changed verdict against $env:BASELINE_REF -- see the log above" }
          "## The corpus gate ran and passed`n`nNo set's verdict differs from ``$env:BASELINE_REF``." |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # The recordings are the evidence, and they are small: stdout and stderr
      # per set, no level data and no solutions. Worth keeping when a run fails.
      - name: Keep the recordings
        if: always() && steps.probe.outputs.present == 'True'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: corpus-recordings
          path: |
            corpus-baseline
            corpus-head
          if-no-files-found: warn

      # 🔴 THIS STEP RUNS ON THE SKIP PATH TOO, WHERE THERE IS NO WORKTREE TO
      # REMOVE, and that is how it failed the first time it was dispatched
      # (run 34840809524). The body was `git worktree remove .. --force 2>$null`
      # followed by `exit 0`, and the exit never ran.
      #
      # THE MEASURED RULE, because the obvious explanation is wrong. It is the
      # REDIRECTION that is fatal, not the stderr and not the exit code. Under
      # $ErrorActionPreference = "Stop" -- which is what GitHub's `powershell`
      # shell sets -- redirecting a native command's stderr inside PowerShell
      # (2>$null, 2>&1) wraps each line in a NativeCommandError ErrorRecord,
      # and that is terminating. Left unredirected the same stderr passes
      # straight through and nothing throws. Tested all four combinations of
      # {redirected, not} x {exit 0, exit 128} against this exact wrapper:
      # only the two redirected cases throw.
      #
      # The corollary is why every step above ends in an explicit $LASTEXITCODE
      # check: a native command exiting 128 does NOT fail a PowerShell step on
      # its own. It printed "fatal:", returned 128, and the step was green.
      #
      # So the fix is simply not to run the command when there is nothing to
      # remove. `exit 0` stays as the backstop. test\run-nofix.ps1 documents
      # this same trap in its own header.
      - name: Remove the baseline worktree
        if: always()
        run: |
          if (Test-Path -LiteralPath ..\tworld-baseline) {
              git worktree remove ..\tworld-baseline --force
          }
          git worktree prune
          exit 0
