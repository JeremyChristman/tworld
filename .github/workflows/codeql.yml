name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so that NEW CodeQL queries run against existing code without
    # waiting for the next commit. This matters more here than in most
    # projects: the code under analysis is a set of parsers for files that
    # strangers make, and it barely changes from month to month -- so almost
    # all of the value of this workflow comes from the query set improving,
    # not from the code changing.
    - cron: '17 5 * * 2'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The upgrade this file used to describe as hypothetical. The `linux-build`
      # job in ci.yml spiked it and it works in about 40 seconds, which also
      # unlocked the `sanitizers` and `fuzz` jobs.
      - name: Install Qt5 and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qttools5-dev-tools libsdl2-dev cmake ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: c-cpp
          # build-mode: manual as of 2026-09-04. CodeQL now observes a REAL
          # compilation, so it sees the preprocessor the way a build does:
          # actual macro expansion, actual include resolution, and no file
          # silently skipped. For C/C++ that is a large accuracy difference --
          # buildless extraction had to guess at TWPLUSPLUS and the thirty-two
          # NO_FIX_* macros.
          #
          # ⚠ IT TRADES ONE BLIND SPOT FOR A DIFFERENT, SMALLER ONE, and that is
          # worth stating plainly rather than claiming a clean win. The observed
          # build is the LINUX Qt build, so:
          #   * `#ifdef WIN32` branches are analyzed in their POSIX form --
          #     fileio.c's DIRSEP_CHAR and createdir() are NOT the ones that
          #     ship (see CLAUDE.md section 3.3, which is the same trap);
          #   * oshw-sdl/ is not compiled by the Qt flavor, so the only
          #     windows.h in the tree is not analyzed at all.
          # What ships is the Windows build, and no CodeQL job here analyzes it.
          # The portable core -- every parser, both engines -- is identical
          # between the two, and that is where the defects have all been.
          build-mode: manual

      # CodeQL wraps this step's compiler invocations. It must be the real
      # build, not a subset: anything not compiled here is not analyzed.
      - name: Build the Qt flavor for CodeQL to observe
        run: |
          cmake -S . -B build-codeql -G Ninja -DCMAKE_BUILD_TYPE=Release -DOSHW=qt
          cmake --build build-codeql

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:c-cpp'
