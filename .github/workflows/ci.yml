name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only is all CI needs. The release workflow asks for more, separately.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds, no toolchain, and it catches the mistakes that are embarrassing rather than subtle.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Nothing personal or copyrighted may be committed
        run: |
          # NOTE: this is a deny-list of specific names, NOT a ban on *.dat.
          # data/ and sets/ legitimately contain upstream's redistributable
          # community packs (CCLP1-5, CCLXP2, intro) and 17 .dac files -- a
          # blanket rule would fail on the first run and get switched off,
          # which is worse than having no rule. See
          # docs/adr/0005-what-level-data-may-be-committed.md.
          #
          # .gitignore covers all of these, but .gitignore does nothing about
          # `git add -f`, and that is exactly what happens while reproducing a
          # bug with someone's solution file.
          bad=$(git ls-files | grep -iE '(^|/)(CHIPS\.dat|tw_settings\.ini)$|\.tws$|^save/' || true)
          if [ -n "$bad" ]; then
            echo "::error::files that must never be committed are tracked:"
            echo "$bad"
            exit 1
          fi
          echo "no copyrighted level data, solution files, save state or settings are tracked"

      - name: The build tag is defined exactly once
        run: |
          # fork.h is the single definition (docs/adr/0006). package.ps1 and
          # build.ps1 both parse it with a regular expression, and a
          # reformatted #define breaks them in a way whose cause is not
          # obvious from the error.
          if ! grep -qE '^[[:space:]]*#[[:space:]]*define[[:space:]]+FORK_BUILD_TAG[[:space:]]+"[^"]+"' fork.h; then
            echo "::error::fork.h has no FORK_BUILD_TAG in the form build.ps1 and package.ps1 expect"
            exit 1
          fi
          tag=$(sed -nE 's/^[[:space:]]*#[[:space:]]*define[[:space:]]+FORK_BUILD_TAG[[:space:]]+"([^"]+)".*/\1/p' fork.h)
          echo "build tag: $tag"
          # README.txt ships inside the download and must describe the build it
          # ships with. package.ps1 enforces this too, but failing here is
          # faster and does not need a toolchain.
          if ! head -5 README.txt | grep -qE "build[[:space:]]+$tag[[:space:]]*$"; then
            echo "::error::README.txt's header does not name build $tag"
            exit 1
          fi
          echo "README.txt header names $tag"

  # The unit layer needs only a C compiler, so it is separate from -- and much
  # faster than -- the job that builds Qt. It is the one that should tell you
  # what broke.
  unit:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # NO THIRD-PARTY ACTION HERE, deliberately. windows-latest ALREADY ships
      # MSYS2 at C:\msys64 -- which is exactly where build.ps1 and
      # test\run-tests.ps1 look by default, so CI exercises the same path
      # handling the maintainer's machines do instead of bypassing it.
      #
      # This started out as msys2/setup-msys2 with `location: C:\`, and the
      # runner refused it outright: "Trying to install MSYS2 to C:\msys64 but
      # that already exists, cannot continue." Using what is already there is
      # simpler, several minutes faster, and removes the one action in this
      # repository that was pinned to a mutable tag rather than a commit SHA.
      # The COMPILER IS PINNED to docs/toolchain.lock. See that file and
      # .github/install-toolchain.ps1: byte-exact replay is this program's
      # purpose, the compiler is an input to it, and CI used to build with
      # whatever gcc happened to be current that morning.
      - name: Install the toolchain packages
        run: powershell -ExecutionPolicy Bypass -File .github/install-toolchain.ps1

      # Seconds, and it guards a claim that had already gone stale: the stock
      # tw_settings.ini shipped in the release zip is hand-written, and jc-41
      # added two settings that never reached it. Runs before the tests because
      # it needs no compiler and its failure is a one-line fix.
      - name: The shipped stock settings file matches the code
        run: powershell -ExecutionPolicy Bypass -File verify-defaults.ps1

      - name: Unit tests
        run: powershell -ExecutionPolicy Bypass -File test\run-tests.ps1 -ResultsPath test-results

      - name: Publish unit test results
        # Runs even when the tests failed -- that is when the report matters most.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-results
          path: test-results/
          if-no-files-found: warn

  # 🔴 THE ONLY PLACE AddressSanitizer CAN RUN.
  #
  # mingw-w64 GCC ships no libasan, so `-fsanitize=address` fails at link time
  # with "cannot find -lasan", making ASan a Linux-only capability here.
  #
  # UBSan is NOT Linux-only, which this repository believed until jc-46:
  # `-fsanitize=undefined` paired with `-fsanitize-undefined-trap-on-error`
  # needs no runtime library and runs fine under mingw-w64. See docs/adr/0010.
  # This job still runs both, because a readable report beats a bare SIGILL
  # when something actually fails.
  #
  # ⭐ THIS JOB PAID FOR ITSELF ON ITS FIRST RUN, and the argument it used to
  # make in this comment is now a measurement. The four memory-safety defects
  # fixed in jc-44 and jc-45 were each found by reading a parser, suspecting a
  # specific line, and hand-building a test that could observe that specific
  # thing -- a method that works and does not scale. The claim was that a
  # sanitizer would observe the whole class without anybody suspecting
  # anything first. That is exactly what happened: the first run found
  # signed-shift undefined behavior in solution.c's .tws seed read (jc-46), in
  # a line nobody had looked at, through a test that had been green for weeks.
  #
  # Needs no Qt and no SDL: the unit tests compile the source under test
  # directly (docs/adr/0003), so gcc alone instruments the engine and the
  # parsers.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          chmod +x test/run-sanitizers.sh
          ./test/run-sanitizers.sh

  # ⭐ FUZZING THE PARSERS AND BOTH ENGINES -- the generalization of what the
  # sanitizer job proved.
  #
  # 🔴 THE TWO HALVES COVER DIFFERENT THINGS, and the second is the one jc-45
  # needed. The four parser targets prove a malformed file is REFUSED. jc-45 was
  # a file that was ACCEPTED -- a beartrap wiring with an out-of-range `to`,
  # through every parser check and then dereferenced inside initgame(). Seven
  # real level sets in circulation carry one. fuzz_mslogic.c and fuzz_lxlogic.c
  # load a level AND play it, which is the only way to reach that class.
  #
  # Every defect this fork has shipped a fix for lives in the same surface.
  # jc-44 was three (a .tws stack smash, a .dat pointer advanced by a
  # file-supplied size, an RLE guard two bytes short); jc-45 was an unguarded
  # map index out of a .dat; jc-46 was signed-shift UB in the .tws seed and time
  # reads. Four releases, one root cause: this program's job is parsing files
  # that strangers made.
  #
  # Five of those six were found by a person reading a parser and guessing which
  # line was wrong. The sixth was found by UBSan in seconds. This job stops
  # guessing entirely: generate inputs until the program itself objects.
  #
  # 🔴 THE COMMITTED CORPUS IS THE PART THAT LASTS. libFuzzer generates fresh
  # inputs each run, so a green run here proves nothing durable. Every input
  # that ever mattered is committed under test/fuzz/corpus/ and replayed by the
  # ORDINARY unit suite on both platforms (test/tw_corpus.h), which is where a
  # finding actually becomes a regression test. This job discovers; that one
  # remembers.
  #
  # Linux-only for three reasons, not one: no libasan, no libFuzzer, and
  # fuzz_leveldata.c uses fmemopen() to avoid a disk write per execution.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fuzz the parsers AND both engines
        # 60s per target across SIX targets -- four parsers and both engines --
        # so about six minutes of fuzzing plus the sanitizer compiles. Long
        # enough to catch a shallow regression on every push, short enough that
        # nobody starts skipping CI. A real soak is FUZZ_SECONDS=600 by hand, or
        # a scheduled job if this ever earns one; it has not, and pretending a
        # six-minute run is a security audit would be theater.
        run: |
          clang --version | head -1
          chmod +x test/run-fuzz.sh
          FUZZ_SECONDS=60 ./test/run-fuzz.sh

      - name: Upload any reproducers
        # Only on failure, and this is the whole value of a red run: the exact
        # bytes that broke it, which then get committed to the corpus.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-findings
          path: test/fuzz/findings/
          if-no-files-found: warn

  # Does this still build on something that is not Windows?
  #
  # Nothing here ships from Linux and nobody plays it there. The job earns its
  # place two other ways: CMakeLists.txt carries a complete non-Windows branch
  # that would otherwise rot unnoticed, and a working Linux build is the
  # prerequisite for giving CodeQL a real compilation database instead of the
  # buildless extraction it falls back on today (see codeql.yml).
  #
  # Allowed to fail the job without failing the workflow would be worse than
  # useless -- a red X people learn to ignore. If this breaks, either fix it or
  # delete the job and say so in docs/adr/0010.
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Qt5 and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qtbase5-dev qttools5-dev-tools libsdl2-dev cmake ninja-build

      - name: Build the Qt flavor
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DOSHW=qt
          cmake --build build-linux
          ls -l build-linux/tworld2

      # The portable core has no Windows-only API -- the only windows.h in the
      # tree is in oshw-sdl, which the Qt flavor does not compile. So the binary
      # should actually run, and its GUI-free command surface is testable here
      # exactly as it is on Windows.
      - name: The built binary answers on its command line
        run: |
          ./build-linux/tworld2 -V | head -3
          ./build-linux/tworld2 -V | grep -q "jc-" || { echo "::error::-V did not report a build tag"; exit 1; }


  # The golden-master engine snapshot: every committed level, both engines,
  # driven by a deterministic move stream and hashed.
  #
  # 🔴 THIS IS THE ONLY JOB THAT CAN SEE AN ENGINE BEHAVIOR CHANGE. Before it
  # existed the entire automated replay gate was one end-to-end case with a
  # single valid and a single invalid solution, and a push that altered engine
  # behavior went green across every job.
  #
  # It runs on Linux deliberately, even though the maintainer develops on
  # Windows: the digests are committed from a Windows build, so a green run
  # here is also a standing check that the snapshot is REPRODUCIBLE ACROSS
  # COMPILERS AND PLATFORMS. That is not decoration -- it is what proves the
  # hashing avoids struct padding and undefined shifts, which is the usual way
  # a scheme like this quietly becomes machine-specific.
  #
  # ⚠ Know what it does NOT cover before trusting it: measured, it detects 2 of
  # the 32 NO_FIX_* engine toggles, and raising the tick or walk count was tried
  # and bought nothing. See test/golden/golden.c. run-corpus.ps1, over the
  # maintainer's real solution collection, is still what decides a release.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the golden-master driver
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror \
              -Wno-unused-value -Wno-unused-variable \
              -O2 -I. -o golden \
              test/golden/golden.c mslogic.c lxlogic.c encoding.c random.c

      # The .dat list is sorted and passed explicitly: the baseline is
      # positional, so a shell glob's ordering is part of the contract.
      - name: The engines still behave exactly as recorded
        run: |
          set -o pipefail
          dats=$(ls data/*.dat | sort | tr '\n' ' ')
          echo "level files: $dats"
          test -n "$dats" || { echo "::error::no level data found"; exit 1; }
          ./golden -check $dats

  # The NO_FIX_* differential matrix: for each recorded witness, build the
  # engine with the fix ON and with it OFF and prove one generated input still
  # tells them apart.
  #
  # 🔴 THIS IS THE ONLY CHECK ON THE DESYNC MACHINERY. mslogic.c carries 32
  # NO_FIX_* toggles -- the switches the whole jc-2..jc-29 project was built
  # with -- and until this existed nothing tested any of them. They are opt-out
  # macros, so a broken one changes no shipped behavior and nothing goes red;
  # it is discovered years later by whoever reaches for the switch. Two of them
  # had already rotted to the point of not compiling.
  #
  # ⚠ Blank rows in the matrix are toggles the search could not distinguish.
  # They are reported, never asserted on: a blank says the search failed to
  # build the arrangement, not that the fix is dead. See test/nofix/nofix.c.
  nofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Every recorded witness still tells the two builds apart
        run: |
          set -o pipefail
          chmod +x test/run-nofix.sh
          ./test/run-nofix.sh

  # Builds the real program and drives it through its GUI-free command line.
  # The DYNAMIC Qt flavor deliberately: it is a fraction of the build time of
  # the static one and runs the same code. The static build is what ships, and
  # package.ps1 is what verifies that one.
  build-and-e2e:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # See the note in the unit job: the runner's own MSYS2 at C:\msys64 is
      # used rather than a third-party action.
      # The COMPILER IS PINNED to docs/toolchain.lock (see
      # .github/install-toolchain.ps1). pkgconf is explicit: test\run-qt-tests.ps1
      # asks pkg-config where Qt is rather than hardcoding include paths, and it
      # SKIPS (exit 0) when it cannot find it -- so a missing pkg-config here
      # would quietly stop the Qt layer running instead of failing the job.
      - name: Install the toolchain packages
        run: >
          powershell -ExecutionPolicy Bypass -File .github/install-toolchain.ps1
          -Extra mingw-w64-x86_64-cmake,mingw-w64-x86_64-ninja,mingw-w64-x86_64-qt5,mingw-w64-x86_64-SDL2,mingw-w64-x86_64-pkgconf

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File build.ps1 -Flavor dynamic -Manifest dist/build-manifest.json

      # The oshw-qt layer. It covers the one parser no other layer can reach:
      # readextensions() parses a .ccx ONLY when a main window exists, so batch
      # mode, the end-to-end cases and all four fuzz targets skip it by
      # construction. Before this existed nothing in oshw-qt\ had any coverage.
      #
      # 🔴 THE RUNNER SKIPS WHEN QT IS MISSING, which is right for a developer
      # machine and would be a silent hole here -- so this step asserts it
      # actually RAN rather than trusting the exit code.
      - name: Qt tests (oshw-qt, the .ccx parser)
        run: |
          $out = powershell -ExecutionPolicy Bypass -File test\run-qt-tests.ps1 2>&1 | Out-String
          Write-Host $out
          if ($out -match 'Qt tests SKIPPED') {
            throw "the Qt layer SKIPPED on a runner that has Qt - it must never skip here"
          }
          if ($out -notmatch 'all Qt test runs passed') { throw "Qt tests failed" }

      - name: End-to-end tests
        # These drive the built executable: directory resolution, .dac parsing,
        # the score table, and a real batch verification of a synthesized level
        # set with one correct and one incorrect solution.
        run: powershell -ExecutionPolicy Bypass -File test\run-e2e.ps1 -ResultsPath test-results

      - name: Publish end-to-end results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: warn

      - name: Upload the build manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-manifest
          path: dist/build-manifest.json
          if-no-files-found: warn
